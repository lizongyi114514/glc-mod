name: build-glc

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8

      # 去掉本地代理配置（CI 不需要，也不该指向 127.0.0.1）
      - name: Strip local proxy settings
        run: sed -i '/systemProp\..*proxy/d' gradle.properties

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: glc-jar
          path: build/libs/*.jar
          if-no-files-found: error
